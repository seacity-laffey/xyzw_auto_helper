<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XYZW 助手</title>
    <link rel="icon" type="image/png" href="/icons/xiaoyugan.png" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        if (theme === "dark" || (theme !== "light" && prefersDark))
          document.documentElement.setAttribute("data-theme", "dark");
      } catch {}
    </script>
    <style>
      :root {
        color: #202020;
        background: #ffffff;
      }

      html[data-theme="dark"] {
        color: #ededed;
        background: #171717;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        color: inherit;
        background: inherit;
        min-height: 100vh;
      }

      #app {
        min-height: 100vh;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        height: 100vh;
        color: #737373;
        font-size: 13px;
      }

      .loading-indicator {
        width: 18px;
        height: 18px;
        border: 1px solid #d4d4d4;
        border-top-color: #202020;
        border-radius: 50%;
        animation: loading-spin 0.8s linear infinite;
      }

      html[data-theme="dark"] .loading {
        color: #a3a3a3;
      }

      html[data-theme="dark"] .loading-indicator {
        border-color: #404040;
        border-top-color: #ededed;
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-indicator {
          animation: none;
        }
      }

      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading">
        <span class="loading-indicator" aria-hidden="true"></span>
        <span>正在加载</span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/xyzw/cocos2d-js-min.js"></script>
    <script type="module" src="/src/xyzw/game-defines.js"></script>
    <script type="module" src="/src/xyzw/index.js"></script>
  </body>
</html>
